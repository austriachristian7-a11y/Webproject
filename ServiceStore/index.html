<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Components | Store & Service</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="assets/css/style.css?v=20261027-billing-receipts" rel="stylesheet">
</head>

<body>
  <div id="authView" class="auth-page d-none">
    <div class="auth-card">
      <div class="brandmark">✦</div>
      <div class="eyebrow mt-3">CORE COMPONENTS</div>
      <h1 id="authTitle">Welcome back</h1>
      <p class="text-secondary" id="authHint">Sign in to continue to your
        account.</p>
      <div id="authError" class="alert alert-danger d-none"></div>
      <form id="authForm" class="vstack gap-3">
        <div id="nameGroup" class="d-none"><label class="form-label">Full
            name</label><input class="form-control" name="name"
            autocomplete="name"></div>
        <div><label class="form-label">Email</label><input class="form-control"
            name="email" type="email" autocomplete="username" required></div>
        <div><label class="form-label">Password</label><input
            class="form-control" name="password" type="password"
            autocomplete="current-password" required></div><button
          class="btn btn-primary w-100" id="authSubmit">Sign in</button>
      </form>
      <button class="btn btn-link w-100 mt-2" id="authToggle">Create a customer
        account</button>
    </div>
  </div>
  <div id="appView" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
      <div class="container-fluid px-lg-4"><a class="navbar-brand fw-bold"
          href="#" data-page="overview"><span class="brandmark-sm">✦</span> CORE
          COMPONENTS <small>STORE & SERVICE</small></a><button
          class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#mainNav"><span
            class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
          <div class="navbar-nav me-auto" id="navLinks"></div>
          <div class="d-flex align-items-center gap-3 text-white"><span
              id="currentUserLabel" class="small"></span><button id="logoutBtn"
              class="btn btn-outline-light btn-sm">Sign out</button></div>
        </div>
      </div>
    </nav>
    <main class="container-fluid px-lg-4 py-4">
      <div id="alertArea"></div>
      <div id="pageContent"></div>
    </main>
    <footer class="container-fluid px-lg-4 py-3 text-secondary small">Core
      Components · Store & Service Portal</footer>
  </div>
  <div class="modal fade" id="appModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="modalForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5><button type="button"
              class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer"><button type="button" class="btn btn-light"
              data-bs-dismiss="modal">Cancel</button><button type="button"
              class="btn btn-outline-primary d-none" id="modalAddToCart">Add to cart</button><button type="button"
              class="btn btn-outline-secondary d-none" id="modalPrintReceipt">Print receipt</button><button
              class="btn btn-primary" id="modalSubmit">Save</button></div>
        </form>
      </div>
    </div>
  </div>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="assets/js/app.js?v=20261027-debit-card"></script>
</body>

</html>
